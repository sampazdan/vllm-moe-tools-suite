name: Publish Runpod container

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Container tag to publish
        required: true
        default: 0.1.0
        type: string
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VLLM_SOURCE_REPOSITORY: sampazdan/vllm-moe-tools
  VLLM_SOURCE_REF: 79df5217ef23fa282ed7cab324cdeb7bce5d8bc1

jobs:
  build-and-push:
    name: Build linux/amd64 image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          df -h /

      - name: Check out application
        uses: actions/checkout@v6

      - name: Check out pinned vLLM fork
        uses: actions/checkout@v6
        with:
          repository: ${{ env.VLLM_SOURCE_REPOSITORY }}
          ref: ${{ env.VLLM_SOURCE_REF }}
          path: vllm-source

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}},value=${{ github.ref_name }},enable=${{ github.event_name == 'push' }}
            type=sha,format=long,prefix=sha-

      - name: Build and publish Runpod image
        id: publish
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: docker/Dockerfile.runpod
          platforms: linux/amd64
          push: true
          build-contexts: |
            vllm_source=./vllm-source
          build-args: |
            VLLM_SOURCE_REF=${{ env.VLLM_SOURCE_REF }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
