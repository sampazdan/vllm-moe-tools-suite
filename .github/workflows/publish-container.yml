name: Publish Runpod container

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Container tag to publish
        required: true
        default: 0.3.0-rc.1
        type: string
      vllm_source_ref:
        description: Immutable 40-character commit from sampazdan/vllm-moe-tools
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VLLM_SOURCE_REPOSITORY: sampazdan/vllm-moe-tools
  VLLM_SOURCE_REF: ${{ inputs.vllm_source_ref || '28a44cf4291c05af070c7d8398c462459b9992d1' }}
  VLLM_IMAGE_VERSION: 0.1.dev2+moe-tools

jobs:
  build-and-push:
    name: Build linux/amd64 image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          df -h /

      - name: Check out application
        uses: actions/checkout@v6

      - name: Validate immutable vLLM source pin
        run: |
          if [[ ! "${VLLM_SOURCE_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "VLLM_SOURCE_REF must be a full lowercase commit SHA" >&2
            exit 1
          fi

      - name: Check out pinned vLLM fork
        uses: actions/checkout@v6
        with:
          repository: ${{ env.VLLM_SOURCE_REPOSITORY }}
          ref: ${{ env.VLLM_SOURCE_REF }}
          path: vllm-source

      - name: Verify checked-out vLLM revision and launcher
        run: |
          test "$(git -C vllm-source rev-parse HEAD)" = "${VLLM_SOURCE_REF}"
          bash -n vllm-source/docker/runpod/runpod-serve.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}},value=${{ github.ref_name }},enable=${{ github.event_name == 'push' }}
            type=sha,format=long,prefix=sha-

      - name: Build and publish Runpod image
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: docker/Dockerfile.runpod
          platforms: linux/amd64
          push: true
          build-contexts: |
            vllm_source=./vllm-source
          build-args: |
            VLLM_SOURCE_REF=${{ env.VLLM_SOURCE_REF }}
            VLLM_IMAGE_VERSION=${{ env.VLLM_IMAGE_VERSION }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
