[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "moe-tools-test-suite"
version = "0.2.0rc3"
description = "Interactive MoE expert-routing and pruning research appliance"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "daytona==0.192.0",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "numpy>=2.1,<3",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/moe_tools_suite"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["backend/tests"]
pythonpath = ["backend/src", "."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
